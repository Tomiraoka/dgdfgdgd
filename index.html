<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aspan — Промежуточная аттестация</title>
  <link rel="icon" type="image/png" href="images/Aspan.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="header">
    <div class="header-container">
      <div class="logo-area">
        <img src="images/Aspan.png" alt="Logo" class="logo-img" />
        <span class="platform-name">Aspan</span>
      </div>
      <div class="header-actions">
        <button id="profile-btn" class="theme-toggle-btn" aria-label="Профиль и статистика" title="Профиль и статистика">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 14a4 4 0 10-8 0m12 7a8 8 0 10-16 0M14 7a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </button>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Переключить тему">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.243 17.657l.707.707M7.343 6.343l.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
          </svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <img src="images/AITU.png" alt="Footer Logo" class="footer-logo" />
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
